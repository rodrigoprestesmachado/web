<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Badge Creator Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
      .badge-preview {
        transition: all 0.3s ease;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1),
          0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      .color-option {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        cursor: pointer;
        transition: transform 0.2s;
        border: 2px solid transparent;
      }
      .color-option:hover,
      .color-option.selected {
        transform: scale(1.1);
      }
      .color-option.selected {
        border-color: #000;
        box-shadow: 0 0 0 2px white, 0 0 0 4px #000;
      }
      .gradient-bg {
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      }
      .badge-text {
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
      }
      .badge-icon {
        filter: drop-shadow(1px 1px 1px rgba(0, 0, 0, 0.3));
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #4f46e5;
        cursor: pointer;
      }
      .icon-option {
        transition: all 0.2s;
      }
      .icon-option.selected {
        background-color: #e0e7ff;
        border-color: #818cf8 !important;
      }
      .shape-option.selected > div {
        border: 2px solid #4f46e5;
        box-shadow: 0 0 0 2px white inset;
      }
      .toggle-option.selected {
        background-color: #4f46e5;
        color: white;
      }
      .download-btn {
        position: relative;
        overflow: hidden;
      }
      .download-btn::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 5px;
        height: 5px;
        background: rgba(255, 255, 255, 0.5);
        opacity: 0;
        border-radius: 100%;
        transform: scale(1, 1) translate(-50%, -50%);
        transform-origin: 50% 50%;
      }
      .download-btn:focus:not(:active)::after {
        animation: ripple 1s ease-out;
      }
      @keyframes ripple {
        0% {
          transform: scale(0, 0);
          opacity: 0.5;
        }
        100% {
          transform: scale(20, 20);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body class="gradient-bg min-h-screen font-sans">
    <div class="container mx-auto px-4 py-8">
      <div class="text-center mb-10">
        <h1 class="text-4xl font-bold text-gray-800 mb-2">Badge Creator</h1>
      </div>

      <div class="flex flex-col lg:flex-row gap-8">
        <!-- Controls Panel -->
        <div class="w-full lg:w-1/3 bg-white rounded-xl shadow-lg p-6 h-fit">
          <h2
            class="text-xl font-semibold text-gray-800 mb-6 flex items-center"
          >
            <i class="fas fa-sliders-h mr-2 text-indigo-500"></i> Customize Your
            Badge
          </h2>

          <div class="space-y-6">
            <!-- Text Input -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Badge Text</label
              >
              <input
                type="text"
                id="badge-text"
                value="NEW"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
              />
            </div>

            <!-- Link Input -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Link (optional)</label
              >
              <input
                type="url"
                id="badge-link"
                placeholder="https://example.com"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
              />
            </div>

            <!-- Icon Selection -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Icon</label
              >
              <div class="grid grid-cols-6 gap-2">
                <div class="icon-option" data-icon="">
                  <div class="p-2 border rounded-lg text-center text-gray-400">
                    None
                  </div>
                </div>
                <div class="icon-option selected" data-icon="star">
                  <div class="p-2 border rounded-lg text-center">
                    <i class="fas fa-star text-yellow-400"></i>
                  </div>
                </div>
                <div class="icon-option" data-icon="heart">
                  <div class="p-2 border rounded-lg text-center">
                    <i class="fas fa-heart text-red-500"></i>
                  </div>
                </div>
                <div class="icon-option" data-icon="bolt">
                  <div class="p-2 border rounded-lg text-center">
                    <i class="fas fa-bolt text-yellow-500"></i>
                  </div>
                </div>
                <div class="icon-option" data-icon="check">
                  <div class="p-2 border rounded-lg text-center">
                    <i class="fas fa-check text-green-500"></i>
                  </div>
                </div>
                <div class="icon-option" data-icon="fire">
                  <div class="p-2 border rounded-lg text-center">
                    <i class="fas fa-fire text-orange-500"></i>
                  </div>
                </div>
                <div class="icon-option" data-icon="trophy">
                  <div class="p-2 border rounded-lg text-center">
                    <i class="fas fa-trophy text-amber-500"></i>
                  </div>
                </div>
                <div class="icon-option" data-icon="gem">
                  <div class="p-2 border rounded-lg text-center">
                    <i class="fas fa-gem text-blue-500"></i>
                  </div>
                </div>
                <div class="icon-option" data-icon="flag">
                  <div class="p-2 border rounded-lg text-center">
                    <i class="fas fa-flag text-red-500"></i>
                  </div>
                </div>
                <div class="icon-option" data-icon="certificate">
                  <div class="p-2 border rounded-lg text-center">
                    <i class="fas fa-certificate text-purple-500"></i>
                  </div>
                </div>
                <div class="icon-option" data-icon="award">
                  <div class="p-2 border rounded-lg text-center">
                    <i class="fas fa-award text-teal-500"></i>
                  </div>
                </div>
                <div class="icon-option" data-icon="crown">
                  <div class="p-2 border rounded-lg text-center">
                    <i class="fas fa-crown text-yellow-500"></i>
                  </div>
                </div>
              </div>
            </div>

            <!-- Color Selection -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2"
                >Color Scheme</label
              >
              <div class="flex flex-wrap gap-2">
                <div
                  class="color-option bg-indigo-500 selected"
                  data-color="indigo"
                ></div>
                <div class="color-option bg-red-500" data-color="red"></div>
                <div class="color-option bg-green-500" data-color="green"></div>
                <div class="color-option bg-blue-500" data-color="blue"></div>
                <div
                  class="color-option bg-yellow-500"
                  data-color="yellow"
                ></div>
                <div
                  class="color-option bg-purple-500"
                  data-color="purple"
                ></div>
                <div class="color-option bg-pink-500" data-color="pink"></div>
                <div class="color-option bg-teal-500" data-color="teal"></div>
                <div class="color-option bg-gray-800" data-color="gray"></div>
                <div
                  class="color-option bg-gradient-to-r from-pink-500 to-yellow-500"
                  data-color="gradient"
                ></div>
              </div>
            </div>

            <!-- Shape Selection -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Shape</label
              >
              <div class="flex gap-4">
                <div class="shape-option selected" data-shape="rounded">
                  <div
                    class="w-16 h-10 bg-indigo-500 rounded-lg flex items-center justify-center text-white"
                  >
                    <i class="fas fa-square-full"></i>
                  </div>
                  <span class="text-xs mt-1 block text-center">Rounded</span>
                </div>
                <div class="shape-option" data-shape="pill">
                  <div
                    class="w-16 h-10 bg-indigo-500 rounded-full flex items-center justify-center text-white"
                  >
                    <i class="fas fa-ellipsis-h"></i>
                  </div>
                  <span class="text-xs mt-1 block text-center">Pill</span>
                </div>
                <div class="shape-option" data-shape="square">
                  <div
                    class="w-16 h-10 bg-indigo-500 flex items-center justify-center text-white"
                  >
                    <i class="fas fa-square"></i>
                  </div>
                  <span class="text-xs mt-1 block text-center">Square</span>
                </div>
              </div>
            </div>

            <!-- Size Slider -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Size: <span id="size-value">Medium</span></label
              >
              <input
                type="range"
                id="size-slider"
                min="0"
                max="2"
                value="1"
                class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer"
              />
            </div>

            <!-- Shadow Toggle -->
            <div class="flex items-center justify-between">
              <label class="block text-sm font-medium text-gray-700"
                >Shadow Effect</label
              >
              <label class="relative inline-flex items-center cursor-pointer">
                <input
                  type="checkbox"
                  id="shadow-toggle"
                  class="sr-only peer"
                  checked
                />
                <div
                  class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-indigo-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"
                ></div>
              </label>
            </div>

            <!-- Clickable Toggle -->
            <div class="flex items-center justify-between">
              <label class="block text-sm font-medium text-gray-700"
                >Make Clickable</label
              >
              <label class="relative inline-flex items-center cursor-pointer">
                <input
                  type="checkbox"
                  id="clickable-toggle"
                  class="sr-only peer"
                />
                <div
                  class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-indigo-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"
                ></div>
              </label>
            </div>

            <!-- Download Button -->
            <button
              id="download-btn"
              class="download-btn w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 px-4 rounded-lg flex items-center justify-center transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
            >
              <i class="fas fa-download mr-2"></i> Download Badge
            </button>
          </div>
        </div>

        <!-- Preview Area -->
        <div class="w-full lg:w-2/3">
          <div class="bg-white rounded-xl shadow-lg p-6">
            <h2
              class="text-xl font-semibold text-gray-800 mb-6 flex items-center"
            >
              <i class="fas fa-eye mr-2 text-indigo-500"></i> Badge Preview
            </h2>

            <div
              class="flex flex-col items-center justify-center p-8 bg-gray-50 rounded-lg min-h-64"
            >
              <div id="badge-preview-container">
                <div
                  id="badge-preview"
                  class="badge-preview bg-indigo-500 text-white px-4 py-2 rounded-lg inline-flex items-center shadow-md cursor-default"
                >
                  <i id="badge-icon" class="fas fa-star mr-2 badge-icon"></i>
                  <span id="badge-text-preview" class="badge-text font-medium"
                    >NEW</span
                  >
                </div>
              </div>

              <div class="mt-8 w-full">
                <h3 class="text-lg font-medium text-gray-800 mb-3">
                  HTML Code
                </h3>
                <div class="bg-gray-800 rounded-lg p-4">
                  <code
                    id="html-code"
                    class="text-gray-200 text-sm font-mono overflow-x-auto block"
                  >
                    &lt;div class="bg-indigo-500 text-white px-4 py-2 rounded-lg
                    inline-flex items-center shadow-md"&gt; &lt;i class="fas
                    fa-star mr-2"&gt;&lt;/i&gt; &lt;span
                    class="font-medium"&gt;NEW&lt;/span&gt; &lt;/div&gt;
                  </code>
                  <button
                    id="copy-html"
                    class="mt-2 text-xs bg-gray-700 hover:bg-gray-600 text-white py-1 px-2 rounded"
                  >
                    <i class="fas fa-copy mr-1"></i> Copy HTML
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // DOM Elements
        const badgeTextInput = document.getElementById("badge-text");
        const badgeLinkInput = document.getElementById("badge-link");
        const badgePreview = document.getElementById("badge-preview");
        const badgePreviewContainer = document.getElementById(
          "badge-preview-container"
        );
        const badgeTextPreview = document.getElementById("badge-text-preview");
        const badgeIcon = document.getElementById("badge-icon");
        const htmlCode = document.getElementById("html-code");
        const copyHtmlBtn = document.getElementById("copy-html");
        const downloadBtn = document.getElementById("download-btn");
        const sizeSlider = document.getElementById("size-slider");
        const sizeValue = document.getElementById("size-value");
        const shadowToggle = document.getElementById("shadow-toggle");
        const clickableToggle = document.getElementById("clickable-toggle");

        // Current settings
        let currentColor = "indigo";
        let currentShape = "rounded";
        let currentIcon = "star";
        let currentSize = 1;
        let hasShadow = true;
        let isClickable = false;

        // Update badge text
        badgeTextInput.addEventListener("input", function () {
          badgeTextPreview.textContent = this.value;
          updateHtmlCode();
        });

        // Update badge link
        badgeLinkInput.addEventListener("input", updateHtmlCode);

        // Icon selection
        document.querySelectorAll(".icon-option").forEach((option) => {
          option.addEventListener("click", function () {
            // Remove selected class from all options
            document.querySelectorAll(".icon-option").forEach((opt) => {
              opt.classList.remove("selected");
            });

            // Add selected class to clicked option
            this.classList.add("selected");

            currentIcon = this.dataset.icon;
            if (currentIcon) {
              badgeIcon.className = `fas fa-${currentIcon} mr-2 badge-icon`;
              badgeIcon.style.display = "inline-block";
            } else {
              badgeIcon.style.display = "none";
            }
            updateBadgeAppearance();
            updateHtmlCode();
          });
        });

        // Color selection
        document.querySelectorAll(".color-option").forEach((option) => {
          option.addEventListener("click", function () {
            // Remove selected class from all options
            document.querySelectorAll(".color-option").forEach((opt) => {
              opt.classList.remove("selected");
            });

            // Add selected class to clicked option
            this.classList.add("selected");

            currentColor = this.dataset.color;
            updateBadgeAppearance();
            updateHtmlCode();
          });
        });

        // Shape selection
        document.querySelectorAll(".shape-option").forEach((option) => {
          option.addEventListener("click", function () {
            // Remove selected class from all options
            document.querySelectorAll(".shape-option").forEach((opt) => {
              opt.classList.remove("selected");
            });

            // Add selected class to clicked option
            this.classList.add("selected");

            currentShape = this.dataset.shape;
            updateBadgeAppearance();
            updateHtmlCode();
          });
        });

        // Size slider
        sizeSlider.addEventListener("input", function () {
          currentSize = parseInt(this.value);
          const sizes = ["Small", "Medium", "Large"];
          sizeValue.textContent = sizes[currentSize];
          updateBadgeAppearance();
          updateHtmlCode();
        });

        // Shadow toggle
        shadowToggle.addEventListener("change", function () {
          hasShadow = this.checked;
          updateBadgeAppearance();
          updateHtmlCode();
        });

        // Clickable toggle
        clickableToggle.addEventListener("change", function () {
          isClickable = this.checked;
          updateBadgeAppearance();
          updateHtmlCode();
        });

        // Copy HTML
        copyHtmlBtn.addEventListener("click", function () {
          navigator.clipboard
            .writeText(htmlCode.textContent.trim())
            .then(() => {
              const originalText = this.innerHTML;
              this.innerHTML = '<i class="fas fa-check mr-1"></i> Copied!';
              setTimeout(() => {
                this.innerHTML = originalText;
              }, 2000);
            });
        });

        // Download badge as PNG
        downloadBtn.addEventListener("click", function () {
          // Show loading state
          const originalContent = this.innerHTML;
          this.innerHTML =
            '<i class="fas fa-spinner fa-spin mr-2"></i> Generating...';
          this.disabled = true;

          // Get the badge element (either the div or a tag)
          const badgeElement = document.querySelector(
            "#badge-preview-container > *"
          );

          // Use html2canvas to create an image
          html2canvas(badgeElement, {
            scale: 2, // Higher quality
            backgroundColor: null, // Transparent background
            logging: false,
            useCORS: true,
            allowTaint: true,
          })
            .then((canvas) => {
              // Create download link
              const link = document.createElement("a");
              link.download = `badge-${Date.now()}.png`;
              link.href = canvas.toDataURL("image/png");
              link.click();

              // Restore button state
              this.innerHTML = originalContent;
              this.disabled = false;
            })
            .catch((err) => {
              console.error("Error generating image:", err);
              alert("Error generating badge image. Please try again.");

              // Restore button state
              this.innerHTML = originalContent;
              this.disabled = false;
            });
        });

        // Update badge appearance based on current settings
        function updateBadgeAppearance() {
          // Set color
          let bgClass;
          if (currentColor === "gradient") {
            bgClass = "bg-gradient-to-r from-pink-500 to-yellow-500";
          } else {
            bgClass = `bg-${currentColor}-500`;
          }

          // Set shape
          let shapeClass;
          switch (currentShape) {
            case "pill":
              shapeClass = "rounded-full";
              break;
            case "square":
              shapeClass = "rounded-none";
              break;
            default:
              shapeClass = "rounded-lg";
              break;
          }

          // Set size
          let sizeClasses;
          switch (currentSize) {
            case 0: // Small
              sizeClasses = "px-3 py-1 text-sm";
              break;
            case 2: // Large
              sizeClasses = "px-6 py-3 text-lg";
              break;
            default: // Medium
              sizeClasses = "px-4 py-2 text-base";
          }

          // Set shadow
          const shadowClass = hasShadow ? "shadow-md" : "shadow-none";

          // Set cursor
          const cursorClass = isClickable
            ? "cursor-pointer hover:opacity-90"
            : "cursor-default";

          // Update badge classes
          badgePreview.className = `badge-preview ${bgClass} text-white ${sizeClasses} ${shapeClass} inline-flex items-center ${shadowClass} ${cursorClass}`;

          // Update container with link if needed
          if (isClickable && badgeLinkInput.value) {
            badgePreviewContainer.innerHTML = `
                        <a href="${
                          badgeLinkInput.value
                        }" target="_blank" id="badge-preview" class="${
              badgePreview.className
            }">
                            ${
                              currentIcon
                                ? `<i class="fas fa-${currentIcon} mr-2 badge-icon"></i>`
                                : ""
                            }
                            <span class="badge-text font-medium">${
                              badgeTextInput.value
                            }</span>
                        </a>
                    `;
          } else {
            badgePreviewContainer.innerHTML = `
                        <div id="badge-preview" class="${
                          badgePreview.className
                        }">
                            ${
                              currentIcon
                                ? `<i class="fas fa-${currentIcon} mr-2 badge-icon"></i>`
                                : ""
                            }
                            <span class="badge-text font-medium">${
                              badgeTextInput.value
                            }</span>
                        </div>
                    `;
          }
        }

        // Update HTML code
        function updateHtmlCode() {
          let iconHtml = currentIcon
            ? `<i class="fas fa-${currentIcon} mr-2"></i>`
            : "";

          let bgClass;
          if (currentColor === "gradient") {
            bgClass = "bg-gradient-to-r from-pink-500 to-yellow-500";
          } else {
            bgClass = `bg-${currentColor}-500`;
          }

          let shapeClass;
          switch (currentShape) {
            case "pill":
              shapeClass = "rounded-full";
              break;
            case "square":
              shapeClass = "rounded-none";
              break;
            default:
              shapeClass = "rounded-lg";
              break;
          }

          let sizeClasses;
          switch (currentSize) {
            case 0:
              sizeClasses = "px-3 py-1 text-sm";
              break;
            case 2:
              sizeClasses = "px-6 py-3 text-lg";
              break;
            default:
              sizeClasses = "px-4 py-2 text-base";
          }

          const shadowClass = hasShadow ? "shadow-md" : "";
          const cursorClass = isClickable
            ? "cursor-pointer hover:opacity-90"
            : "cursor-default";

          if (isClickable && badgeLinkInput.value) {
            htmlCode.textContent = `<a href="${badgeLinkInput.value}" target="_blank" class="${bgClass} text-white ${sizeClasses} ${shapeClass} inline-flex items-center ${shadowClass} ${cursorClass}">
    ${iconHtml}
    <span class="font-medium">${badgeTextInput.value}</span>
</a>`;
          } else {
            htmlCode.textContent = `<div class="${bgClass} text-white ${sizeClasses} ${shapeClass} inline-flex items-center ${shadowClass} ${cursorClass}">
    ${iconHtml}
    <span class="font-medium">${badgeTextInput.value}</span>
</div>`;
          }
        }

        // Initialize
        updateBadgeAppearance();
        updateHtmlCode();
      });
    </script>
  </body>
</html>
