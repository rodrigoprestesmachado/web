<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerador de Senhas Seguras</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      .password-strength {
        height: 4px;
        transition: all 0.3s ease;
      }
      .strength-0 {
        background-color: #ef4444;
        width: 20%;
      }
      .strength-1 {
        background-color: #f97316;
        width: 40%;
      }
      .strength-2 {
        background-color: #eab308;
        width: 60%;
      }
      .strength-3 {
        background-color: #84cc16;
        width: 80%;
      }
      .strength-4 {
        background-color: #22c55e;
        width: 100%;
      }
      .copy-btn {
        transition: all 0.2s ease;
      }
      .copy-btn:hover {
        transform: scale(1.05);
      }
      .copy-btn:active {
        transform: scale(0.95);
      }
      .fade-in {
        animation: fadeIn 0.3s ease-in;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-12 max-w-md">
      <div class="text-center mb-10">
        <h1 class="text-3xl font-bold text-indigo-700 mb-2">
          Gerador de Senhas
        </h1>
      </div>
      <div class="bg-white rounded-xl shadow-lg overflow-hidden">
        <div class="p-6">
          <div class="mb-6">
            <div class="flex items-center justify-between mb-2">
              <label
                for="passwordLength"
                class="block text-sm font-medium text-gray-700"
              >
                Tamanho:
                <span id="lengthValue">12</span>
              </label>
              <span id="password-strength-text" class="text-xs font-medium">
                Força: Média
              </span>
            </div>
            <input
              type="range"
              id="passwordLength"
              min="6"
              max="32"
              value="12"
              class="w-full h-2 bg-gray-200 rounded-lg \ appearance-none cursor-pointer"
            />
          </div>
          <div class="space-y-3 mb-6">
            <div class="flex items-center">
              <input
                type="checkbox"
                id="uppercase"
                checked
                class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 \ border-gray-300 rounded"
              />
              <label for="uppercase" class="ml-2 block text-sm text-gray-700">
                Letras maiúsculas (A-Z)
              </label>
            </div>
            <div class="flex items-center">
              <input
                type="checkbox"
                id="lowercase"
                checked
                class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 \ border-gray-300 rounded"
              />
              <label for="lowercase" class="ml-2 block text-sm text-gray-700">
                Letras minúsculas (a-z)
              </label>
            </div>
            <div class="flex items-center">
              <input
                type="checkbox"
                id="numbers"
                checked
                class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 \ border-gray-300 rounded"
              />
              <label for="numbers" class="ml-2 block text-sm text-gray-700">
                Números (0-9)
              </label>
            </div>
            <div class="flex items-center">
              <input
                type="checkbox"
                id="symbols"
                checked
                class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 \ border-gray-300 rounded"
              />
              <label for="symbols" class="ml-2 block text-sm text-gray-700">
                Símbolos (!@#$%^&*)
              </label>
            </div>
            <div class="flex items-center">
              <input
                type="checkbox"
                id="excludeSimilar"
                class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 \ border-gray-300 rounded"
              />
              <label
                for="excludeSimilar"
                class="ml-2 block text-sm text-gray-700"
              >
                Excluir caracteres similares (i,l,1,L,o,0,O)
              </label>
            </div>
          </div>
          <div class="mb-6">
            <div class="flex items-center justify-between mb-1">
              <label class="block text-sm font-medium text-gray-700">
                Sua senha:
              </label>
              <button
                id="refreshBtn"
                class="text-indigo-600 hover:text-indigo-800 text-sm \ flex items-center"
              >
                <i class="fas fa-sync-alt mr-1"></i> Atualizar
              </button>
            </div>
            <div class="relative">
              <input
                type="text"
                id="passwordOutput"
                readonly
                class="w-full px-4 py-3 bg-gray-100 border border-gray-300 \ rounded-lg focus:ring-indigo-500 focus:border-indigo-500 font-mono"
              />
              <button
                id="copyBtn"
                class="absolute right-2 top-1/2 transform -translate-y-1/2 \ bg-indigo-100 hover:bg-indigo-200 text-indigo-700 p-2 rounded-lg copy-btn"
              >
                <i class="fas fa-copy"></i>
              </button>
            </div>
            <div
              id="strengthBar"
              class="password-strength strength-2 mt-2 rounded-full"
            ></div>
          </div>
          <button
            id="generateBtn"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white \ font-medium py-3 px-4 rounded-lg transition duration-300 flex \ items-center justify-center"
          >
            <i class="fas fa-key mr-2"></i> Gerar Nova Senha
          </button>
        </div>
      </div>
    </div>
    <div
      id="copyNotification"
      class="fixed bottom-4 right-4 bg-green-500 text-white px-4 py-2 \ rounded-lg shadow-lg hidden fade-in"
    >
      <i class="fas fa-check-circle mr-2"></i> Senha copiada!
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // Elementos DOM
        const passwordLength = document.getElementById("passwordLength");
        const lengthValue = document.getElementById("lengthValue");
        const uppercase = document.getElementById("uppercase");
        const lowercase = document.getElementById("lowercase");
        const numbers = document.getElementById("numbers");
        const symbols = document.getElementById("symbols");
        const excludeSimilar = document.getElementById("excludeSimilar");
        const passwordOutput = document.getElementById("passwordOutput");
        const generateBtn = document.getElementById("generateBtn");
        const refreshBtn = document.getElementById("refreshBtn");
        const copyBtn = document.getElementById("copyBtn");
        const strengthBar = document.getElementById("strengthBar");
        const strengthText = document.getElementById("password-strength-text");
        const copyNotification = document.getElementById("copyNotification");

        // Conjuntos de caracteres
        const charSets = {
          uppercase: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
          lowercase: "abcdefghijklmnopqrstuvwxyz",
          numbers: "0123456789",
          symbols: "!@#$%^&*()_+-=[]{}|;:,.<>?",
        };

        // Caracteres similares para excluir
        const similarChars = "iIl1Lo0O";

        // Atualizar valor do tamanho
        passwordLength.addEventListener("input", function () {
          lengthValue.textContent = this.value;
          generatePassword();
        });

        // Gerar senha quando qualquer opção mudar
        [uppercase, lowercase, numbers, symbols, excludeSimilar].forEach(
          (checkbox) => {
            checkbox.addEventListener("change", generatePassword);
          }
        );

        // Botões
        generateBtn.addEventListener("click", generatePassword);
        refreshBtn.addEventListener("click", generatePassword);

        // Copiar senha
        copyBtn.addEventListener("click", function () {
          if (!passwordOutput.value) return;

          navigator.clipboard
            .writeText(passwordOutput.value)
            .then(() => {
              copyNotification.classList.remove("hidden");
              setTimeout(() => {
                copyNotification.classList.add("hidden");
              }, 2000);
            })
            .catch((err) => {
              console.error("Erro ao copiar:", err);
            });
        });

        // Gerar senha inicial
        generatePassword();

        // Função principal para gerar senha
        function generatePassword() {
          // Verificar se pelo menos um conjunto está selecionado
          if (
            !uppercase.checked &&
            !lowercase.checked &&
            !numbers.checked &&
            !symbols.checked
          ) {
            passwordOutput.value = "Selecione pelo menos uma opção";
            strengthBar.className =
              "password-strength strength-0 mt-2 rounded-full";
            strengthText.textContent = "Força: Muito fraca";
            return;
          }

          // Construir conjunto de caracteres disponíveis
          let availableChars = "";
          if (uppercase.checked) availableChars += charSets.uppercase;
          if (lowercase.checked) availableChars += charSets.lowercase;
          if (numbers.checked) availableChars += charSets.numbers;
          if (symbols.checked) availableChars += charSets.symbols;

          // Remover caracteres similares se selecionado
          if (excludeSimilar.checked) {
            for (const char of similarChars) {
              availableChars = availableChars.replace(char, "");
            }
          }

          // Gerar senha aleatória
          const length = parseInt(passwordLength.value);
          let password = "";
          for (let i = 0; i < length; i++) {
            const randomIndex = Math.floor(
              Math.random() * availableChars.length
            );
            password += availableChars[randomIndex];
          }

          // Exibir senha e calcular força
          passwordOutput.value = password;
          updatePasswordStrength(password);
        }

        // Calcular força da senha
        function updatePasswordStrength(password) {
          let score = 0;

          // Verificar comprimento
          if (password.length >= 12) score += 1;
          if (password.length >= 16) score += 1;

          // Verificar variedade de caracteres
          const hasUpper = /[A-Z]/.test(password);
          const hasLower = /[a-z]/.test(password);
          const hasNumber = /[0-9]/.test(password);
          const hasSymbol = /[^A-Za-z0-9]/.test(password);

          if (hasUpper && hasLower) score += 1;
          if (hasNumber) score += 1;
          if (hasSymbol) score += 1;

          // Limitar score entre 0 e 4
          score = Math.min(Math.max(score, 0), 4);

          // Atualizar UI
          strengthBar.className = `password-strength strength-${score} mt-2 rounded-full`;

          // Texto descritivo
          const strengthTexts = [
            "Muito fraca",
            "Fraca",
            "Média",
            "Forte",
            "Muito forte",
          ];
          strengthText.textContent = `Força: ${strengthTexts[score]}`;
        }
      });
    </script>
  </body>
</html>
